# Closed-network step verify: portal UI → local docker build/save (no login/Jenkins/Nexus)
#
# On internet host (once):
#   docker compose -f docker-compose.local.yml build
#   docker tag msbuild-factory-portal:latest msbuild-portal:airgap
#   docker save msbuild-portal:airgap -o msbuild-portal.tar
#
# On closed-network Linux Docker host:
#   docker load -i msbuild-portal.tar
#   docker compose -f docker-compose.airgap-local.yml up -d
#   open http://<host>:8000/
services:
  portal:
    image: ${PORTAL_IMAGE:-msbuild-portal:airgap}
    platform: linux/amd64
    ports:
      - "${PORTAL_HOST_PORT:-8000}:8000"
    environment:
      PORTAL_ALLOW_INSECURE_DEFAULTS: "true"
      PORTAL_LOCAL_FACTORY: "true"
      PORTAL_SIMULATE_WORKERS: "false"
      PORTAL_REQUIRE_AUTH: "false"
      PORTAL_DEFAULT_ACTOR_ROLES: "operator,builder"
      PORTAL_GIT_RESOLVE_MODE: "placeholder"
      PORTAL_DATABASE_URL: "sqlite:////tmp/portal-local.db"
      PORTAL_LOCAL_IMAGES_DIR: "/var/portal-local-images"
      PORTAL_LOCAL_IMAGE_REPO: "msbuild-local"
      PORTAL_REGISTRY_HOST: "local"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./local-images:/var/portal-local-images
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 25s
