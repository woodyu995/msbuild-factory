apiVersion: v1
kind: Pod
metadata:
  name: msbuild-builder-ltsc2019
  labels:
    app.kubernetes.io/name: msbuild-project-build
    build.company.io/windows-release: ltsc2019
    build.company.io/purpose: msbuild
spec:
  os:
    name: windows
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/os: windows
    build.company.io/windows-release: ltsc2019
    build.company.io/purpose: msbuild
  tolerations:
    - key: build.company.io/windows
      operator: Equal
      value: "true"
      effect: NoSchedule
  imagePullSecrets:
    - name: internal-registry-secret
  containers:
    - name: builder
      image: registry.internal/build/msbuild-profile@sha256:REPLACE_ME
      imagePullPolicy: IfNotPresent
      workingDir: C:\workspace
      resources:
        requests:
          cpu: "2"
          memory: 4Gi
          ephemeral-storage: 20Gi
        limits:
          cpu: "8"
          memory: 16Gi
          ephemeral-storage: 80Gi
