# Example secrets — replace values before apply (or use ExternalSecrets/SealedSecrets).
# Copy to secret.yaml (gitignored) or apply via sealed-secrets.
apiVersion: v1
kind: Secret
metadata:
  name: portal-secrets
  namespace: msbuild-portal
type: Opaque
stringData:
  PORTAL_DATABASE_URL: "postgresql+psycopg://portal:CHANGE_ME@postgres.msbuild-portal.svc.cluster.local:5432/portal"
  PORTAL_CALLBACK_HMAC_SECRET: "CHANGE_ME_LONG_RANDOM"
  PORTAL_JENKINS_API_TOKEN: "CHANGE_ME"
  PORTAL_API_TOKENS: "portal-ui:CHANGE_UI_TOKEN:builder,jenkins-bot:CHANGE_BOT_TOKEN:operator|builder"
  PORTAL_GIT_TOKEN: ""
---
# Minimal secret for lease-reconcile CronJob (HMAC only)
apiVersion: v1
kind: Secret
metadata:
  name: portal-callback-hmac
  namespace: msbuild-portal
type: Opaque
stringData:
  PORTAL_CALLBACK_HMAC_SECRET: "CHANGE_ME_LONG_RANDOM"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: msbuild-portal
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGE_ME"
---
# Image pull secret for Portal Deployment (namespace msbuild-portal)
apiVersion: v1
kind: Secret
metadata:
  name: nexus-docker-pull
  namespace: msbuild-portal
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "nexus.company.io:8082": {
          "username": "ci-pull",
          "password": "CHANGE_ME",
          "auth": "BASE64(user:pass)"
        }
      }
    }
---
# Same pull secret for Windows workers (namespace msbuild-build)
apiVersion: v1
kind: Secret
metadata:
  name: nexus-docker-pull
  namespace: msbuild-build
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "nexus.company.io:8082": {
          "username": "ci-pull",
          "password": "CHANGE_ME",
          "auth": "BASE64(user:pass)"
        }
      }
    }
